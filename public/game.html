    // 获取当前属性值
    function getAttributeValue(attr) {
        const input = document.getElementById(attrInputIds[attr]);
        return parseInt(input.value) || 0;
    }

    // 获取熟练加值
    function getProficiencyBonus() {
        return parseInt(document.getElementById('proficiency-bonus').value) || 2;
    }

    // 更新豁免检定显示
    function updateSavingThrowsDisplay() {
        if (!currentCharacter) return;
        const bonus = getProficiencyBonus();
        ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'].forEach(attr => {
            const baseValue = getAttributeValue(attr);
            const isProficient = currentCharacter.savingThrows.includes(attr);
            const value = isProficient ? baseValue + bonus : baseValue;
            document.getElementById(`save-val-${attr}`).textContent = value;
            document.querySelector(`.save-checkbox[data-attr="${attr}"]`).checked = isProficient;
        });
    }

    // 更新技能显示
    function updateSkillsDisplay() {
        if (!currentCharacter) return;
        const bonus = getProficiencyBonus();
        Object.keys(skillAttributeMap).forEach(skill => {
            const attr = skillAttributeMap[skill];
            const baseValue = getAttributeValue(attr);
            const isProficient = currentCharacter.skills.includes(skill);
            const value = isProficient ? baseValue + bonus : baseValue;
            document.getElementById(`skill-val-${skill}`).textContent = value;
            document.querySelector(`.skill-checkbox[data-skill="${skill}"]`).checked = isProficient;
        });
    }

    // 豁免检定勾选变化
    function onSavingThrowChange(attr, checked, checkbox) {
        if (!currentCharacter || !isCharEditMode) {
            checkbox.checked = !checked;
            return;
        }
        if (checked && currentCharacter.savingThrows.length >= 2) {
            checkbox.checked = false;
            showCharToast('豁免检定最多选择2个', true);
            return;
        }
        if (checked) {
            currentCharacter.savingThrows.push(attr);
        } else {
            currentCharacter.savingThrows = currentCharacter.savingThrows.filter(a => a !== attr);
        }
        updateSavingThrowsDisplay();
    }

    // 技能勾选变化
    function onSkillChange(skill, checked, checkbox) {
        if (!currentCharacter || !isCharEditMode) {
            checkbox.checked = !checked;
            return;
        }
        if (checked && currentCharacter.skills.length >= 4) {
            checkbox.checked = false;
            showCharToast('技能最多选择4个', true);
            return;
        }
        if (checked) {
            currentCharacter.skills.push(skill);
        } else {
            currentCharacter.skills = currentCharacter.skills.filter(s => s !== skill);
        }
        updateSkillsDisplay();
    }

    // 更新专长显示
    function updateFeatsDisplay() {
        const container = document.getElementById('feats-list');
        container.innerHTML = '';
        const feats = currentCharacter?.feats || [];
        feats.forEach((feat, index) => {
            const item = createFeatElement(feat, index);
            container.appendChild(item);
        });
        // 更新输入框和按钮的禁用状态

        container.querySelectorAll('.feat-name-input, .feat-desc-input').forEach(input => {
            input.disabled = disabled;
        });
        container.querySelectorAll('.remove-feat-btn').forEach(btn => {
            btn.style.display = isCharEditMode ? 'block' : 'none';
        });
    }

    // 创建专长元素
    function createFeatElement(feat, index) {
        const item = document.createElement('div');
        item.className = 'feat-item';
        item.dataset.index = index;
        item.innerHTML = `
            <input type="text" class="feat-name-input" placeholder="专长名称" value="${escapeHtml(feat.name || '')}" disabled>
            <textarea class="feat-desc-input" placeholder="专长描述" disabled>${escapeHtml(feat.description || '')}</textarea>
            <button class="remove-feat-btn" onclick="removeFeat(${index})" style="display: none;">×</button>
        `;
        return item;
    }

    // HTML转义
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 同步UI中的专长内容到currentCharacter
    function syncFeatsFromUI() {
        if (!currentCharacter) return;
        currentCharacter.feats = getFeatsFromUI();
    }

    // 添加专长
    function addFeat() {
        if (!currentCharacter || !isCharEditMode) return;
        // 先保存当前UI中已填写的内容
        syncFeatsFromUI();
        currentCharacter.feats.push({ name: '', description: '' });
        updateFeatsDisplay();
    }

    // 删除专长
    function removeFeat(index) {
        if (!currentCharacter || !isCharEditMode) return;
        // 先保存当前UI中已填写的内容
        syncFeatsFromUI();
        currentCharacter.feats.splice(index, 1);
        updateFeatsDisplay();
    }

    // 从 UI 获取专长数据
    function getFeatsFromUI() {
        const feats = [];
        document.querySelectorAll('.feat-item').forEach(item => {
            const name = item.querySelector('.feat-name-input').value.trim();
            const description = item.querySelector('.feat-desc-input').value.trim();
            // 只保存非空的专长
            if (name || description) {
                feats.push({ name, description });
            }
        });
        return feats;
    }

    // 橡皮拖拽状态
    let isErasing = false;

    // ===== Phase 8-C 迷雾遮罩状态 =====
    const worldFogData = [];            // [{ id, x, y, w, h }]（镜像 world.fogRects，世界像素坐标）
    const worldFogNodes = new Map();    // id -> Konva.Rect（fogLayer）
    let fogPatternCanvas = null;        // 预生成的马赛克 canvas（懒初始化）
    // 迷雾绘制中间状态
    let isKonvaFog = false;
    let konvaFogStartPos = null;        // { x, y } 世界坐标（mousedown 时记录）
    let konvaTempFog = null;            // 正在拖拽中的临时 Konva.Rect
    // 地图拖拽时迷雾实时跟随的初始状态（DM 端视觉效果，不同步服务端）
    let fogDragStartData = null;        // { origWorldX, origWorldY, wrappedFog: [{id, origX, origY}] }

    function initKonvaWorld() {
        if (konvaStage) return;
        const rect = worldContainer.getBoundingClientRect();
        konvaStage = new Konva.Stage({
            container: 'konva-stage',
            width: rect.width,
            height: rect.height,
            draggable: true,
        });
        gridLayer = new Konva.Layer({ listening: false });
        staticLayer = new Konva.Layer();  // 放置地图
        fogLayer = new Konva.Layer();     // 迷雾遮罩（gridLayer 之上，棋子之下）
        dynamicLayer = new Konva.Layer(); // 棋子 + NPC
        drawingLayer = new Konva.Layer(); // 笔画/矩形（最顶，覆盖棋子）
        konvaStage.add(staticLayer);
        konvaStage.add(gridLayer);
        konvaStage.add(fogLayer);
        konvaStage.add(dynamicLayer);
        konvaStage.add(drawingLayer);

        konvaStage.on('wheel', onStageWheel);
        konvaStage.on('dragmove', onStageTransformChanged);
        konvaStage.on('dragend', onStageTransformChanged);
        // 点击空白（stage 本身）取消选中
        konvaStage.on('click tap', (e) => {
            if (!isDM) return;
            if (e.target === konvaStage) deselectPlacedMap();
        });
        // 绘图工具事件（Phase 5）
        konvaStage.on('mousedown', onStageDrawMouseDown);
        konvaStage.on('mousemove', onStageDrawMouseMove);
        konvaStage.on('mouseup', finalizeWorldDraw);

        // 容器尺寸变化时同步 stage 与网格
        new ResizeObserver(() => {
            const r = worldContainer.getBoundingClientRect();
            konvaStage.size({ width: r.width, height: r.height });
            onStageTransformChanged();
        }).observe(worldContainer);

        onStageTransformChanged();
        initHpTooltip();
        initNameTooltip();
    }

    function onStageWheel(e) {
        e.evt.preventDefault();
        const oldScale = konvaStage.scaleX();
        const pointer = konvaStage.getPointerPosition();
        if (!pointer) return;
        const worldPos = {
            x: (pointer.x - konvaStage.x()) / oldScale,
            y: (pointer.y - konvaStage.y()) / oldScale,
        };
        const direction = e.evt.deltaY > 0 ? -1 : 1;
        const target = direction > 0 ? oldScale * ZOOM_STEP : oldScale / ZOOM_STEP;
        const newScale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, target));
        konvaStage.scale({ x: newScale, y: newScale });
        konvaStage.position({
            x: pointer.x - worldPos.x * newScale,
            y: pointer.y - worldPos.y * newScale,
        });
        onStageTransformChanged();
    }

    function onStageTransformChanged() {
        drawGrid();
        updateAllPlacedMapOverlays();
        if (konvaStage) konvaStage.batchDraw();
    }

    // 网格用 Konva.Line 绘制在 gridLayer 上，只覆盖当前可视世界范围
    // 与地图共享 stage 变换，缩放/平移时永不错位
    function drawGrid() {
        if (!konvaStage || !gridLayer) return;
        gridLayer.destroyChildren();
        const scale = konvaStage.scaleX();
        const left = -konvaStage.x() / scale;
        const top = -konvaStage.y() / scale;
        const right = left + konvaStage.width() / scale;
        const bottom = top + konvaStage.height() / scale;
        const startGX = Math.floor(left / GRID_SIZE);
        const endGX = Math.ceil(right / GRID_SIZE);
        const startGY = Math.floor(top / GRID_SIZE);
        const endGY = Math.ceil(bottom / GRID_SIZE);
        const stroke = 'rgba(255, 255, 255, 0.12)';
        const strokeWidth = 1 / scale; // 折算成屏幕 1px
        for (let gx = startGX; gx <= endGX; gx++) {
            const wx = gx * GRID_SIZE;
            gridLayer.add(new Konva.Line({ points: [wx, top, wx, bottom], stroke, strokeWidth, listening: false }));
        }
        for (let gy = startGY; gy <= endGY; gy++) {
            const wy = gy * GRID_SIZE;
            gridLayer.add(new Konva.Line({ points: [left, wy, right, wy], stroke, strokeWidth, listening: false }));
        }
        gridLayer.batchDraw();
    }

    // 世界坐标 <-> 格子坐标 工具函数
    function worldToGrid(x, y) {
        return { gx: x / GRID_SIZE, gy: y / GRID_SIZE };
    }
    function gridToWorld(gx, gy) {
        return { x: gx * GRID_SIZE, y: gy * GRID_SIZE };
    }
    function snapToGrid(gx, gy) {
        return { gx: Math.round(gx), gy: Math.round(gy) };
    }
    function getMousePosInWorld() {
        if (!konvaStage) return null;
        const pointer = konvaStage.getPointerPosition();
        if (!pointer) return null;
        const scale = konvaStage.scaleX();
        return {
            x: (pointer.x - konvaStage.x()) / scale,
            y: (pointer.y - konvaStage.y()) / scale,
        };
    }

    // 渲染所有已知但尚未创建 Konva 节点的放置地图（资产已缓存时）
    function renderPendingPlacedMaps() {
        placedMapsData.forEach(placed => {
            if (placedMapNodes.has(placed.id)) return;
            if (mapAssetCache[placed.assetId]) renderPlacedMap(placed);
        });
    }

    // ===== Phase 4：世界 token/NPC Konva 渲染 =====

    function initHpTooltip() {
        if (hpTooltip) return;
        const tag = new Konva.Tag({ fill: 'rgba(0,0,0,0.78)', cornerRadius: 4, pointerEnabled: false });
        const text = new Konva.Text({
            text: '', fill: 'white', fontSize: 12, padding: 5,
            fontFamily: 'Segoe UI, sans-serif',
        });
        hpTooltip = new Konva.Label({ x: 0, y: 0, visible: false, listening: false });
        hpTooltip.add(tag);
        hpTooltip.add(text);
        drawingLayer.add(hpTooltip); // HP tooltip 需在最顶层（drawingLayer）以免被笔画遮挡
    }

    function getTokenHP(color) {
        const curEl = document.getElementById(`hp-cur-${color}`);
        const maxEl = document.getElementById(`hp-max-${color}`);
        if (!curEl || !maxEl) return null;
        const cur = curEl.textContent;
        const max = maxEl.textContent;
        if (cur === '_' || max === '_') return null;
        return { cur, max };
    }

    function showTokenTooltip(color, circle) {
        const hp = getTokenHP(color);
        if (!hp || !hpTooltip) return;
        const textNode = hpTooltip.getText();
        textNode.text(`❤️ ${hp.cur} / ${hp.max}`);
        const tw = textNode.width();
        hpTooltip.position({
            x: circle.x() - tw / 2,
            y: circle.y() + TOKEN_RADIUS + 6,
        });
        hpTooltip.visible(true);
        hpTooltip.moveToTop();
        drawingLayer.batchDraw();
    }

    function hideTokenTooltip() {
        if (!hpTooltip) return;
        hpTooltip.visible(false);
        drawingLayer.batchDraw();
    }

    function initNameTooltip() {
        if (nameTooltip) return;
        const tag = new Konva.Tag({ fill: 'rgba(0,0,0,0.78)', cornerRadius: 4, pointerEnabled: false });
        const text = new Konva.Text({
            text: '', fill: 'white', fontSize: 12, padding: 5,
            fontFamily: 'Segoe UI, sans-serif',
        });
        nameTooltip = new Konva.Label({ x: 0, y: 0, visible: false, listening: false });
        nameTooltip.add(tag);
        nameTooltip.add(text);
        drawingLayer.add(nameTooltip);
    }

    function getTokenPlayerName(color) {
        const el = document.getElementById(`name-${color}`);
        if (!el) return null;
        return el.textContent.replace('（这是我）', '').trim() || null;
    }

    function showNameTooltip(color, circle) {
        const name = getTokenPlayerName(color);
        if (!name || !nameTooltip) return;
        const textNode = nameTooltip.getText();
        textNode.text(name);
        const tw = textNode.width();
        const lh = nameTooltip.height();
        nameTooltip.position({
            x: circle.x() - tw / 2,
            y: circle.y() - TOKEN_RADIUS - lh - 6,
        });
        nameTooltip.visible(true);
        nameTooltip.moveToTop();
        drawingLayer.batchDraw();
    }

    function hideNameTooltip() {
        if (!nameTooltip) return;
        nameTooltip.visible(false);
        drawingLayer.batchDraw();
    }

    function renderWorldToken(tokenData) {
        // 移除已有同色节点
        const existing = worldTokenNodes.get(tokenData.color);
        if (existing) { existing.destroy(); worldTokenNodes.delete(tokenData.color); }

        const cx = (tokenData.gridX + 0.5) * GRID_SIZE;
        const cy = (tokenData.gridY + 0.5) * GRID_SIZE;
        const fill = colorMap[tokenData.color] || tokenData.color;
        const canDrag = isDM || (userColor === tokenData.color);

        const circle = new Konva.Circle({
            x: cx, y: cy,
            radius: TOKEN_RADIUS,
            fill,
            stroke: 'rgba(0,0,0,0.55)',
            strokeWidth: 2.5,
            shadowColor: 'black',
            shadowBlur: 6,
            shadowOpacity: 0.5,
            draggable: canDrag,
            listening: true,
        });

        if (canDrag) {
            // 开始拖动时立即显示 tooltip（hover 可能被 dragstart 打断）
            circle.on('dragstart', () => {
                showTokenTooltip(tokenData.color, circle);
                showNameTooltip(tokenData.color, circle);
            });
            // 拖动过程中两个 tooltip 同步跟随
            circle.on('dragmove', () => {
                if (hpTooltip && hpTooltip.visible()) {
                    const tw = hpTooltip.getText().width();
                    hpTooltip.position({
                        x: circle.x() - tw / 2,
                        y: circle.y() + TOKEN_RADIUS + 6,
                    });
                }
                if (nameTooltip && nameTooltip.visible()) {
                    const tw = nameTooltip.getText().width();
                    const lh = nameTooltip.height();
                    nameTooltip.position({
                        x: circle.x() - tw / 2,
                        y: circle.y() - TOKEN_RADIUS - lh - 6,
                    });
                }
                dynamicLayer.batchDraw();
                drawingLayer.batchDraw();
            });
            circle.on('dragend', () => {
                hideTokenTooltip();
                hideNameTooltip();
                const gx = Math.round((circle.x() - GRID_SIZE / 2) / GRID_SIZE);
                const gy = Math.round((circle.y() - GRID_SIZE / 2) / GRID_SIZE);
                circle.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                dynamicLayer.batchDraw();
                socket.emit('token:move', { color: tokenData.color, gridX: gx, gridY: gy });
            });
        }

        circle.on('mouseenter', () => {
            showTokenTooltip(tokenData.color, circle);
            showNameTooltip(tokenData.color, circle);
        });
        // 拖动时不触发 mouseleave 隐藏（isDragging() 为 true 时跳过）
        circle.on('mouseleave', () => {
            if (!circle.isDragging()) {
                hideTokenTooltip();
                hideNameTooltip();
            }
        });

        dynamicLayer.add(circle);
        worldTokenNodes.set(tokenData.color, circle);
        dynamicLayer.batchDraw();
    }

    function renderWorldNpc(npcData) {
        const existing = worldNpcNodes.get(npcData.id);
        if (existing) { existing.destroy(); worldNpcNodes.delete(npcData.id); }

        const cx = (npcData.gridX + 0.5) * GRID_SIZE;
        const cy = (npcData.gridY + 0.5) * GRID_SIZE;
        const size = TOKEN_RADIUS * 2; // 与玩家棋子直径相同

        // NPC 用圆角矩形 + "NPC" 标签，以 Group 承载，方便统一定位
        const group = new Konva.Group({
            x: cx, y: cy,
            draggable: isDM,
            listening: isDM,
        });

        const rect = new Konva.Rect({
            x: -size / 2, y: -size / 2,
            width: size, height: size,
            cornerRadius: Math.round(size * 0.2),
            fill: npcData.color || '#7f8c8d',
            stroke: 'rgba(0,0,0,0.55)',
            strokeWidth: 2.5,
            shadowColor: 'black',
            shadowBlur: 6,
            shadowOpacity: 0.5,
        });

        const label = new Konva.Text({
            x: -size / 2, y: -size / 2,
            width: size, height: size,
            text: 'NPC',
            fontSize: Math.round(size * 0.28),
            fontFamily: 'Segoe UI, sans-serif',
            fontStyle: 'bold',
            fill: 'rgba(255,255,255,0.92)',
            align: 'center',
            verticalAlign: 'middle',
            listening: false,
        });

        group.add(rect);
        group.add(label);

        if (isDM) {
            group.on('dragend', () => {
                const gx = Math.round((group.x() - GRID_SIZE / 2) / GRID_SIZE);
                const gy = Math.round((group.y() - GRID_SIZE / 2) / GRID_SIZE);
                group.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                dynamicLayer.batchDraw();
                socket.emit('npc:move', { id: npcData.id, gridX: gx, gridY: gy });
            });
            // 双击删除
            group.on('dblclick dbltap', () => {
                socket.emit('npc:remove', npcData.id);
            });
        }

        dynamicLayer.add(group);
        worldNpcNodes.set(npcData.id, group);
        dynamicLayer.batchDraw();
    }

    // ===== Phase 5: 世界笔画/矩形 渲染 =====

    // 纯渲染函数：只创建 Konva 节点，不修改数据数组（避免 renderPendingWorldObjects 重复 push）
    // hitStrokeWidth 放大命中区域，使橡皮拖擦时更容易触碰到线条
    function renderWorldFreeStroke(data) {
        if (worldDrawingNodes.has(data.id)) return;
        const line = new Konva.Line({
            points: data.points,
            stroke: data.color,
            strokeWidth: data.strokeWidth,
            lineCap: 'round',
            lineJoin: 'round',
            listening: false,
            hitStrokeWidth: 20,
        });
        drawingLayer.add(line);
        worldDrawingNodes.set(data.id, line);
        drawingLayer.batchDraw();
    }

    function renderWorldRect(data) {
        if (worldRectNodes.has(data.id)) return;
        const rect = new Konva.Rect({
            x: data.gridX * GRID_SIZE,
            y: data.gridY * GRID_SIZE,
            width: data.gridW * GRID_SIZE,
            height: data.gridH * GRID_SIZE,
            stroke: data.color,
            strokeWidth: data.strokeWidth,
            fill: 'transparent',
            listening: false,
        });
        drawingLayer.add(rect);
        worldRectNodes.set(data.id, rect);
        drawingLayer.batchDraw();
    }

    // 橡皮拖擦：在 drawingLayer 中做命中检测，将触碰到的笔画/矩形立即删除
    function eraseAtPointer() {
        if (!drawingLayer) return;
        const pointer = konvaStage.getPointerPosition();
        if (!pointer) return;
        const hit = drawingLayer.getIntersection(pointer);
        if (!hit) return;

        let erasedId = null;
        worldDrawingNodes.forEach((node, id) => { if (node === hit && !erasedId) erasedId = id; });
        worldRectNodes.forEach((node, id) => { if (node === hit && !erasedId) erasedId = id; });
        if (!erasedId) return;

        // 乐观删除（立即销毁节点，再通知服务端）
        const dIdx = worldDrawingsData.findIndex(d => d.id === erasedId);
        if (dIdx !== -1) worldDrawingsData.splice(dIdx, 1);
        const dNode = worldDrawingNodes.get(erasedId);
        if (dNode) { dNode.destroy(); worldDrawingNodes.delete(erasedId); }
        const rIdx = worldRectsData.findIndex(r => r.id === erasedId);
        if (rIdx !== -1) worldRectsData.splice(rIdx, 1);
        const rNode = worldRectNodes.get(erasedId);
        if (rNode) { rNode.destroy(); worldRectNodes.delete(erasedId); }
        drawingLayer.batchDraw();
        socket.emit('draw:remove', erasedId);
    }

    function clearWorldDrawings() {
        if (!isDM) return;
        worldDrawingsData.length = 0;
        worldRectsData.length = 0;
        worldDrawingNodes.forEach(node => node.destroy());
        worldDrawingNodes.clear();
        worldRectNodes.forEach(node => node.destroy());
        worldRectNodes.clear();
        liveStrokeNodes.forEach(node => node.destroy());
        liveStrokeNodes.clear();
        if (drawingLayer) drawingLayer.batchDraw();
        socket.emit('draw:clearAll');
    }

    // 世界绘图事件处理（由 initKonvaWorld 注册，全局函数方便 window mouseup 引用）
    function onStageDrawMouseDown(e) {
        if (!isDM) return;
        if (currentTool === 'erase') { isErasing = true; eraseAtPointer(); return; }
        if (currentTool !== 'draw' && currentTool !== 'rect' && currentTool !== 'fog') return;
        // updateNodeListening 已禁用棋子/地图节点的事件，点击会穿透到 stage，无需检查 e.target
        const pos = getMousePosInWorld();
        if (!pos) return;

        if (currentTool === 'fog') {
            // 若点击到已有迷雾节点则不开始绘制（保留 dblclick 删除功能）
            if (e.target !== konvaStage) return;
            isKonvaFog = true;
            konvaFogStartPos = { x: pos.x, y: pos.y };
            konvaTempFog = new Konva.Rect({
                x: pos.x, y: pos.y,
                width: 0, height: 0,
                fill: 'rgba(30,30,50,0.5)',
                strokeEnabled: false,
                listening: false,
            });
            fogLayer.add(konvaTempFog);
            fogLayer.batchDraw();
            return;
        }

        if (currentTool === 'draw') {
            isKonvaDrawing = true;
            currentStrokeId = genDrawId('dw');
            lastLiveEmit = 0;
            konvaDrawPoints = [pos.x, pos.y];
            konvaTempLine = new Konva.Line({
                points: konvaDrawPoints,
                stroke: penColor,
                strokeWidth: 3,
                lineCap: 'round',
                lineJoin: 'round',
                listening: false,
            });
            drawingLayer.add(konvaTempLine);
            drawingLayer.batchDraw();
        } else if (currentTool === 'rect') {
            const startGrid = { gx: pos.x / GRID_SIZE, gy: pos.y / GRID_SIZE };
            isKonvaRect = true;
            konvaRectStartGrid = startGrid;
            konvaTempRect = new Konva.Rect({
                x: startGrid.gx * GRID_SIZE, y: startGrid.gy * GRID_SIZE,
                width: 0, height: 0,
                stroke: rectColor,
                strokeWidth: 3,
                fill: 'transparent',
                listening: false,
            });
            drawingLayer.add(konvaTempRect);
            drawingLayer.batchDraw();
        }
    }

    function onStageDrawMouseMove(e) {
        if (!isDM) return;
        if (isErasing) { eraseAtPointer(); return; }
        const pos = getMousePosInWorld();
        if (!pos) return;

        if (isKonvaFog && konvaTempFog && konvaFogStartPos) {
            const x1 = Math.min(konvaFogStartPos.x, pos.x);
            const y1 = Math.min(konvaFogStartPos.y, pos.y);
            konvaTempFog.setAttrs({
                x: x1, y: y1,
                width: Math.abs(pos.x - konvaFogStartPos.x),
                height: Math.abs(pos.y - konvaFogStartPos.y),
            });
            fogLayer.batchDraw();
            return;
        }

        if (isKonvaDrawing && konvaTempLine) {
            konvaDrawPoints.push(pos.x, pos.y);
            konvaTempLine.points(konvaDrawPoints);
            drawingLayer.batchDraw();
            // 实时广播给其他人（50ms 节流）
            const now = Date.now();
            if (now - lastLiveEmit >= 50) {
                socket.emit('draw:liveStroke', {
                    id: currentStrokeId,
                    points: konvaDrawPoints.slice(),
                    color: penColor,
                    strokeWidth: 3,
                });
                lastLiveEmit = now;
            }
        } else if (isKonvaRect && konvaTempRect && konvaRectStartGrid) {
            const curGrid = { gx: pos.x / GRID_SIZE, gy: pos.y / GRID_SIZE };
            const x1 = Math.min(konvaRectStartGrid.gx, curGrid.gx);
            const y1 = Math.min(konvaRectStartGrid.gy, curGrid.gy);
            const x2 = Math.max(konvaRectStartGrid.gx, curGrid.gx);
            const y2 = Math.max(konvaRectStartGrid.gy, curGrid.gy);
            konvaTempRect.setAttrs({
                x: x1 * GRID_SIZE, y: y1 * GRID_SIZE,
                width: (x2 - x1) * GRID_SIZE,
                height: (y2 - y1) * GRID_SIZE,
            });
            drawingLayer.batchDraw();
        }
    }

    function finalizeWorldDraw() {
        if (isErasing) { isErasing = false; return; }

        if (isKonvaFog && konvaTempFog) {
            const x = konvaTempFog.x();
            const y = konvaTempFog.y();
            const w = konvaTempFog.width();
            const h = konvaTempFog.height();
            konvaTempFog.destroy();
            if (fogLayer) fogLayer.batchDraw();
            konvaTempFog = null;
            konvaFogStartPos = null;
            isKonvaFog = false;
            if (w >= 5 && h >= 5) {
                socket.emit('fog:add', { x, y, w, h });
            }
            return;
        }
        if (isKonvaDrawing && konvaTempLine) {
            if (konvaDrawPoints.length >= 4) {
                const data = {
                    id: currentStrokeId,
                    points: konvaDrawPoints.slice(),
                    color: penColor,
                    strokeWidth: 3,
                };
                // 乐观渲染：konvaTempLine 已在 drawingLayer，直接注册 id
                worldDrawingNodes.set(data.id, konvaTempLine);
                worldDrawingsData.push(data);
                drawingLayer.batchDraw();
                socket.emit('draw:freeStroke', data);
            } else {
                konvaTempLine.destroy();
                drawingLayer.batchDraw();
            }
            konvaTempLine = null;
            konvaDrawPoints = [];
            currentStrokeId = null;
            isKonvaDrawing = false;
        }

        if (isKonvaRect && konvaTempRect && konvaRectStartGrid) {
            const pos = getMousePosInWorld();
            const endGrid = pos
                ? { gx: pos.x / GRID_SIZE, gy: pos.y / GRID_SIZE }
                : konvaRectStartGrid;
            const x1 = Math.min(konvaRectStartGrid.gx, endGrid.gx);
            const y1 = Math.min(konvaRectStartGrid.gy, endGrid.gy);
            const gridW = Math.max(konvaRectStartGrid.gx, endGrid.gx) - x1;
            const gridH = Math.max(konvaRectStartGrid.gy, endGrid.gy) - y1;

            if (gridW > 0 && gridH > 0) {
                const id = genDrawId('dr');
                const data = { id, gridX: x1, gridY: y1, gridW, gridH, color: rectColor, strokeWidth: 3 };
                // konvaTempRect 已在 drawingLayer，直接注册
                worldRectNodes.set(id, konvaTempRect);
                worldRectsData.push(data);
                drawingLayer.batchDraw();
                socket.emit('draw:rect', data);
            } else {
                konvaTempRect.destroy();
                drawingLayer.batchDraw();
            }
            konvaTempRect = null;
            konvaRectStartGrid = null;
            isKonvaRect = false;
        }
    }

    // ===== Phase 8-C 迷雾遮罩渲染 =====

    function createFogPattern() {
        const size = 64;
        const cellSize = 8;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const colors = ['#1a1a2e', '#16213e', '#0f3460', '#1a1a2e'];
        for (let row = 0; row < size / cellSize; row++) {
            for (let col = 0; col < size / cellSize; col++) {
                ctx.fillStyle = colors[(row + col) % colors.length];
                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
            }
        }
        return canvas;
    }

    function renderWorldFog(fogRect) {
        if (worldFogNodes.has(fogRect.id)) return;
        if (!fogPatternCanvas) fogPatternCanvas = createFogPattern();
        const rectConfig = {
            x: fogRect.x, y: fogRect.y,
            width: fogRect.w, height: fogRect.h,
            strokeEnabled: false,
            listening: isDM,
        };
        if (isDM) {
            rectConfig.fill = 'rgba(180,180,180,1)';
            rectConfig.opacity = 0.7;
        } else {
            rectConfig.fillPatternImage = fogPatternCanvas;
            rectConfig.fillPatternRepeat = 'repeat';
            rectConfig.opacity = 0.99;
        }
        const rect = new Konva.Rect(rectConfig);
        if (isDM) {
            rect.on('dblclick dbltap', () => {
                socket.emit('fog:remove', fogRect.id);
            });
        }
        fogLayer.add(rect);
        worldFogNodes.set(fogRect.id, rect);
        fogLayer.batchDraw();
    }

    // 返回被指定地图"包裹"的迷雾遮罩列表（至少一个顶点在地图边界内）
    // 使用操作前的旧坐标调用，然后再更新 placed 坐标
    function getFogRectsWrappedByMap(placed) {
        const asset = mapAssetCache[placed.assetId];
        if (!asset) return [];
        const ratio = asset.originalHeight / asset.originalWidth;
        const mapX1 = placed.gridX * GRID_SIZE;
        const mapY1 = placed.gridY * GRID_SIZE;
        const mapX2 = (placed.gridX + placed.gridWidth) * GRID_SIZE;
        const mapY2 = (placed.gridY + placed.gridWidth * ratio) * GRID_SIZE;
        return worldFogData.filter(f => {
            const corners = [
                [f.x, f.y], [f.x + f.w, f.y],
                [f.x, f.y + f.h], [f.x + f.w, f.y + f.h],
            ];
            return corners.some(([cx, cy]) =>
                cx >= mapX1 && cx <= mapX2 && cy >= mapY1 && cy <= mapY2
            );
        });
    }

    // 返回被指定地图"包裹"的四类对象（用于 isBound 联动）
    // 必须在地图坐标更新前调用，以旧坐标为准
    function getWrappedObjects(placed) {
        const asset = mapAssetCache[placed.assetId];
        if (!asset) return { tokens: [], npcs: [], freeDrawings: [], rects: [] };
        const ratio = asset.originalHeight / asset.originalWidth;
        const mapGX1 = placed.gridX;
        const mapGY1 = placed.gridY;
        const mapGX2 = placed.gridX + placed.gridWidth;
        const mapGY2 = placed.gridY + placed.gridWidth * ratio;
        const mapPX1 = mapGX1 * GRID_SIZE;
        const mapPY1 = mapGY1 * GRID_SIZE;
        const mapPX2 = mapGX2 * GRID_SIZE;
        const mapPY2 = mapGY2 * GRID_SIZE;
        const inGrid = (cx, cy) => cx >= mapGX1 && cx <= mapGX2 && cy >= mapGY1 && cy <= mapGY2;
        const inPx = (px, py) => px >= mapPX1 && px <= mapPX2 && py >= mapPY1 && py <= mapPY2;

        const tokens = worldTokensData.filter(t => inGrid(t.gridX + 0.5, t.gridY + 0.5));
        const npcs = worldNpcsData.filter(n => inGrid(n.gridX + 0.5, n.gridY + 0.5));
        const freeDrawings = worldDrawingsData.filter(d => {
            const pts = d.points;
            for (let i = 0; i + 1 < pts.length; i += 2) {
                if (inPx(pts[i], pts[i + 1])) return true;
            }
            return false;
        });
        const rects = worldRectsData.filter(r => {
            const corners = [
                [r.gridX, r.gridY], [r.gridX + r.gridW, r.gridY],
                [r.gridX, r.gridY + r.gridH], [r.gridX + r.gridW, r.gridY + r.gridH],
            ];
            return corners.some(([cx, cy]) => inGrid(cx, cy));
        });
        return { tokens, npcs, freeDrawings, rects };
    }

    // 开启世界视图时一次性渲染所有待渲染的世界对象
    function renderPendingWorldObjects() {
        renderPendingPlacedMaps();
        worldTokensData.forEach(t => {
            if (!worldTokenNodes.has(t.color)) renderWorldToken(t);
        });
        worldNpcsData.forEach(n => {
            if (!worldNpcNodes.has(n.id)) renderWorldNpc(n);
        });
        worldDrawingsData.forEach(d => {
            if (!worldDrawingNodes.has(d.id)) renderWorldFreeStroke(d);
        });
        worldRectsData.forEach(r => {
            if (!worldRectNodes.has(r.id)) renderWorldRect(r);
        });
        worldFogData.forEach(f => {
            if (!worldFogNodes.has(f.id)) renderWorldFog(f);
        });
    }

    window.addEventListener('mouseup', finalizeWorldDraw);

    window.addEventListener('keydown', (e) => {

    // ===== Phase 2: DM 地图放置 / 拖动吸附 / 锁定 / 删除（仅本地） =====
    function genPlacedMapId() { return `pm_${Date.now()}_${++placedMapSeq}`; }
    function genMapAssetId() { return `ma_${Date.now()}_${++mapAssetSeq}`; }

    // ===== Phase 8-A: 地图资产库 =====

    function removeMapAsset(assetId) {
        if (!isDM) return;
        if (!confirm('删除该地图资产会同步删除所有已放置的对应地图实例，确认删除？')) return;
        socket.emit('mapAsset:remove', assetId);

    function onAddWorldMapClick() {
        if (!isDM) return;
        if (!konvaStage) initKonvaWorld();
        document.getElementById('world-file-input').click();
    }

    // 文件选择 -> 读取为 Base64 -> 解析尺寸 -> 在视口中央放置
    document.getElementById('world-file-input').addEventListener('change', (e) => {
        if (!isDM) return;
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const base64 = ev.target.result;
            const img = new Image();
            img.onload = () => {
                const assetId = genMapAssetId();
                mapAssetCache[assetId] = {
                    base64,
                    originalWidth: img.naturalWidth,
                    originalHeight: img.naturalHeight,
                };
                pendingAssetUpload.set(assetId, () => placeMapAtViewportCenter(assetId));
                socket.emit('mapAsset:upload', {
                    assetId,
                    base64,
                    originalWidth: img.naturalWidth,
                    originalHeight: img.naturalHeight,
                });
            };
            img.onerror = () => console.error('地图图片解析失败');
            img.src = base64;
        };
        reader.onerror = () => console.error('地图文件读取失败');
        reader.readAsDataURL(file);
        e.target.value = '';
    });

    function placeMapAtViewportCenter(assetId) {
        if (!isDM) return;
        const asset = mapAssetCache[assetId];
        if (!asset) return;
        if (!konvaStage) initKonvaWorld();

        const scale = konvaStage.scaleX();
        const centerWorld = {
            x: (konvaStage.width() / 2 - konvaStage.x()) / scale,
            y: (konvaStage.height() / 2 - konvaStage.y()) / scale,
        };
        const gridWidth = 20;
        const ratio = asset.originalHeight / asset.originalWidth;
        const gridHeight = gridWidth * ratio;
        const center = worldToGrid(centerWorld.x, centerWorld.y);
        const snapped = snapToGrid(center.gx - gridWidth / 2, center.gy - gridHeight / 2);
        socket.emit('placedMap:add', {
            id: genPlacedMapId(),
            assetId,
            gridX: snapped.gx,
            gridY: snapped.gy,
            gridWidth,
            isLocked: false,
            isBound: true,
        });
    }

    function showToast(msg) {
        const container = document.getElementById('world-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = 'position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;z-index:100;pointer-events:none;transition:opacity 0.4s;';
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 400);
        }, 1600);
    }

    function focusOnPlacedMap(assetId) {
        const placed = placedMapsData.find(m => m.assetId === assetId);
        if (!placed) {
            if (isDM) {
                placeMapAtViewportCenter(assetId);
                showToast('无对应地图实例，已生成新的');
            } else {
                showToast('DM还没有放置该地图');
            }
            return;
        }
        if (!konvaStage) return;
        const asset = mapAssetCache[assetId];
        if (!asset) return;
        const ratio = asset.originalHeight / asset.originalWidth;
        const worldW = placed.gridWidth * GRID_SIZE;
        const worldH = placed.gridWidth * ratio * GRID_SIZE;
        const stageW = konvaStage.width();
        const stageH = konvaStage.height();
        let scale = Math.min(stageW / worldW, stageH / worldH) * 0.9;
        scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, scale));
        const mapWorldX = placed.gridX * GRID_SIZE;
        const mapWorldY = placed.gridY * GRID_SIZE;
        const tx = stageW / 2 - (mapWorldX + worldW / 2) * scale;
        const ty = stageH / 2 - (mapWorldY + worldH / 2) * scale;
        konvaStage.scale({ x: scale, y: scale });
        konvaStage.position({ x: tx, y: ty });
        const node = placedMapNodes.get(placed.id);
        if (node) { node.moveToTop(); staticLayer.batchDraw(); }
        onStageTransformChanged();
    }

    function renderPlacedMap(placed, bringToTop = false) {
        const asset = mapAssetCache[placed.assetId];
        if (!asset) return;
        const ratio = asset.originalHeight / asset.originalWidth;
        const imgEl = new Image();
        imgEl.onload = () => {
            const node = new Konva.Image({
                id: placed.id,
                name: 'placed-map',
                x: placed.gridX * GRID_SIZE,
                y: placed.gridY * GRID_SIZE,
                width: placed.gridWidth * GRID_SIZE,
                height: placed.gridWidth * ratio * GRID_SIZE,
                image: imgEl,
                draggable: isDM && !placed.isLocked,
                listening: isDM,
            });
            node.on('mousedown touchstart', (e) => {
                if (!isDM) return;
                e.cancelBubble = true;       // 阻止冒泡到 stage 触发其 drag
                selectPlacedMap(placed.id);
            });
            node.on('dragstart', () => {
                const wrappedFog = getFogRectsWrappedByMap(placed).map(f => ({ id: f.id, origX: f.x, origY: f.y }));
                fogDragStartData = {
                    origWorldX: placed.gridX * GRID_SIZE,
                    origWorldY: placed.gridY * GRID_SIZE,
                    wrappedFog,
                };
                if (placed.isBound) {
                    const wrapped = getWrappedObjects(placed);
                    fogDragStartData.wrappedTokens = wrapped.tokens.map(t => ({ color: t.color, origGX: t.gridX, origGY: t.gridY }));
                    fogDragStartData.wrappedNpcs = wrapped.npcs.map(n => ({ id: n.id, origGX: n.gridX, origGY: n.gridY }));
                    fogDragStartData.wrappedDrawings = wrapped.freeDrawings.map(d => ({ id: d.id, origPoints: d.points.slice() }));
                    fogDragStartData.wrappedRects = wrapped.rects.map(r => ({ id: r.id, origGX: r.gridX, origGY: r.gridY }));
                }
            });
            node.on('dragmove', () => {
                updatePlacedMapOverlay(placed.id);
                if (!fogDragStartData) return;
                const dx = node.x() - fogDragStartData.origWorldX;
                const dy = node.y() - fogDragStartData.origWorldY;
                if (fogDragStartData.wrappedFog.length > 0) {
                    fogDragStartData.wrappedFog.forEach(({ id: fid, origX, origY }) => {
                        const fogNode = worldFogNodes.get(fid);
                        if (fogNode) fogNode.position({ x: origX + dx, y: origY + dy });
                    });
                    if (fogLayer) fogLayer.batchDraw();
                }
                if (placed.isBound && fogDragStartData.wrappedTokens) {
                    fogDragStartData.wrappedTokens.forEach(({ color, origGX, origGY }) => {
                        const tNode = worldTokenNodes.get(color);
                        if (tNode) tNode.position({ x: (origGX + 0.5) * GRID_SIZE + dx, y: (origGY + 0.5) * GRID_SIZE + dy });
                    });
                    fogDragStartData.wrappedNpcs.forEach(({ id: nid, origGX, origGY }) => {
                        const nNode = worldNpcNodes.get(nid);
                        if (nNode) nNode.position({ x: (origGX + 0.5) * GRID_SIZE + dx, y: (origGY + 0.5) * GRID_SIZE + dy });
                    });
                    fogDragStartData.wrappedDrawings.forEach(({ id: did, origPoints }) => {
                        const dNode = worldDrawingNodes.get(did);
                        if (dNode) dNode.points(origPoints.map((v, i) => i % 2 === 0 ? v + dx : v + dy));
                    });
                    fogDragStartData.wrappedRects.forEach(({ id: rid, origGX, origGY }) => {
                        const rNode = worldRectNodes.get(rid);
                        if (rNode) rNode.position({ x: origGX * GRID_SIZE + dx, y: origGY * GRID_SIZE + dy });
                    });
                    if (fogDragStartData.wrappedTokens.length || fogDragStartData.wrappedNpcs.length) dynamicLayer.batchDraw();
                    if (fogDragStartData.wrappedDrawings.length || fogDragStartData.wrappedRects.length) drawingLayer.batchDraw();
                }
            });
            node.on('dragend', () => {
                const snapped = snapToGrid(node.x() / GRID_SIZE, node.y() / GRID_SIZE);
                const dgx = snapped.gx - placed.gridX;
                const dgy = snapped.gy - placed.gridY;
                // fog 强制联动（始终计算，placed 仍为旧坐标）
                const movedFogRects = getFogRectsWrappedByMap(placed).map(f => ({
                    id: f.id, x: f.x + dgx * GRID_SIZE, y: f.y + dgy * GRID_SIZE,
                }));
                // isBound：四类对象联动
                let movedTokens = [], movedNpcs = [], movedFreeDrawings = [], movedRects = [];
                if (placed.isBound) {
                    const wrapped = getWrappedObjects(placed);
                    movedTokens = wrapped.tokens.map(t => ({ id: t.color, gridX: t.gridX + dgx, gridY: t.gridY + dgy }));
                    movedNpcs = wrapped.npcs.map(n => ({ id: n.id, gridX: n.gridX + dgx, gridY: n.gridY + dgy }));
                    movedFreeDrawings = wrapped.freeDrawings.map(d => ({
                        id: d.id,
                        points: d.points.map((v, i) => i % 2 === 0 ? v + dgx * GRID_SIZE : v + dgy * GRID_SIZE),
                    }));
                    movedRects = wrapped.rects.map(r => ({ id: r.id, gridX: r.gridX + dgx, gridY: r.gridY + dgy }));
                }
                // 更新 placed 坐标
                placed.gridX = snapped.gx;
                placed.gridY = snapped.gy;
                node.position({ x: placed.gridX * GRID_SIZE, y: placed.gridY * GRID_SIZE });
                // 乐观应用迷雾移动
                movedFogRects.forEach(({ id: fid, x, y }) => {
                    const fog = worldFogData.find(f => f.id === fid);
                    if (fog) { fog.x = x; fog.y = y; }
                    const fogNode = worldFogNodes.get(fid);
                    if (fogNode) fogNode.position({ x, y });
                });
                if (movedFogRects.length > 0 && fogLayer) fogLayer.batchDraw();
                // 乐观应用四类对象移动
                if (placed.isBound) {
                    movedTokens.forEach(({ id: tid, gridX: gx, gridY: gy }) => {
                        const t = worldTokensData.find(t => t.color === tid);
                        if (t) { t.gridX = gx; t.gridY = gy; }
                        const tNode = worldTokenNodes.get(tid);
                        if (tNode) tNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                    });
                    movedNpcs.forEach(({ id: nid, gridX: gx, gridY: gy }) => {
                        const n = worldNpcsData.find(n => n.id === nid);
                        if (n) { n.gridX = gx; n.gridY = gy; }
                        const nNode = worldNpcNodes.get(nid);
                        if (nNode) nNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                    });
                    movedFreeDrawings.forEach(({ id: did, points: newPts }) => {
                        const d = worldDrawingsData.find(d => d.id === did);
                        if (d) d.points = newPts;
                        const dNode = worldDrawingNodes.get(did);
                        if (dNode) dNode.points(newPts);
                    });
                    movedRects.forEach(({ id: rid, gridX: gx, gridY: gy }) => {
                        const r = worldRectsData.find(r => r.id === rid);
                        if (r) { r.gridX = gx; r.gridY = gy; }
                        const rNode = worldRectNodes.get(rid);
                        if (rNode) rNode.position({ x: gx * GRID_SIZE, y: gy * GRID_SIZE });
                    });
                    if ((movedTokens.length || movedNpcs.length) && dynamicLayer) dynamicLayer.batchDraw();
                    if ((movedFreeDrawings.length || movedRects.length) && drawingLayer) drawingLayer.batchDraw();
                }
                updatePlacedMapOverlay(placed.id);
                socket.emit('placedMap:move', {
                    id: placed.id, gridX: placed.gridX, gridY: placed.gridY,
                    movedFogRects, movedTokens, movedNpcs, movedFreeDrawings, movedRects,
                });
            });
            staticLayer.add(node);
            if (bringToTop) { node.moveToTop(); } else { node.moveToBottom(); }
            placedMapNodes.set(placed.id, node);
            if (isDM) {
                createOverlayForPlacedMap(placed);
                const ov = placedMapOverlays.get(placed.id);
                if (ov) {
                    node.on('mouseenter', ov.showBtns);
                    node.on('mouseleave', ov.scheduleHide);
                }
            }
            updatePlacedMapOverlay(placed.id);
        };
        imgEl.onerror = () => console.error('Konva.Image 加载失败:', placed.id);
        imgEl.src = asset.base64;
    }

    function createOverlayForPlacedMap(placed) {
        const wrap = document.createElement('div');
        wrap.dataset.mapid = placed.id;

        const lockBtn = document.createElement('button');
        lockBtn.className = 'placed-map-lock' + (placed.isLocked ? ' locked' : '');
        lockBtn.textContent = placed.isLocked ? '🔒' : '🔓';
        lockBtn.title = placed.isLocked ? '点击解锁' : '点击锁定';
        lockBtn.style.display = 'none';
        lockBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            togglePlacedMapLock(placed.id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'placed-map-delete';
        deleteBtn.textContent = '🗑';
        deleteBtn.title = '删除该地图';
        deleteBtn.style.display = 'none';
        deleteBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            removePlacedMap(placed.id);
        });

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'placed-map-resize';
        resizeHandle.title = '拖动缩放地图';
        resizeHandle.style.display = 'none';
        resizeHandle.addEventListener('mousedown', (ev) => startResize(ev, placed.id));

        const initialBound = placed.isBound !== false;
        const bindBtn = document.createElement('button');
        bindBtn.className = 'placed-map-lock placed-map-bind' + (initialBound ? '' : ' unbound');
        bindBtn.textContent = initialBound ? '📌' : '📍';
        bindBtn.title = initialBound ? '对象已绑定（点击解绑）' : '对象未绑定（点击绑定）';
        bindBtn.style.display = 'none';
        bindBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            togglePlacedMapBound(placed.id);
        });

        const sizeLabel = document.createElement('div');
        sizeLabel.className = 'placed-map-size-label';
        sizeLabel.style.display = 'none';

        wrap.appendChild(lockBtn);
        wrap.appendChild(deleteBtn);
        wrap.appendChild(resizeHandle);
        wrap.appendChild(bindBtn);
        wrap.appendChild(sizeLabel);
        placedMapOverlaysEl.appendChild(wrap);

        const ov = { wrap, lockBtn, deleteBtn, resizeHandle, bindBtn, sizeLabel, hoverTimer: null, isHovered: false };

        ov.showBtns = function() {
            clearTimeout(ov.hoverTimer);
            ov.isHovered = true;
            const pm = placedMapsData.find(m => m.id === placed.id);
            lockBtn.style.display = '';
            bindBtn.style.display = '';
            const unlocked = pm && !pm.isLocked;
            deleteBtn.style.display = unlocked ? '' : 'none';
            resizeHandle.style.display = unlocked ? '' : 'none';
        };

        ov.scheduleHide = function() {
            ov.hoverTimer = setTimeout(() => {
                if (resizeState && resizeState.mapId === placed.id) return;
                ov.isHovered = false;
                lockBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                resizeHandle.style.display = 'none';
                bindBtn.style.display = 'none';
            }, 120);
        };

        [lockBtn, deleteBtn, resizeHandle, bindBtn].forEach(el => {
            el.addEventListener('mouseenter', () => clearTimeout(ov.hoverTimer));
            el.addEventListener('mouseleave', ov.scheduleHide);
        });

        placedMapOverlays.set(placed.id, ov);
    }

    function updatePlacedMapOverlay(mapId) {
        const overlay = placedMapOverlays.get(mapId);
        const node = placedMapNodes.get(mapId);
        if (!overlay || !node || !konvaStage) return;
        const scale = konvaStage.scaleX();
        const screenLeft = konvaStage.x() + node.x() * scale;
        const screenTop = konvaStage.y() + node.y() * scale;
        const screenRight = screenLeft + node.width() * scale;
        const screenBottom = screenTop + node.height() * scale;
        const inset = 6;
        const btnSize = 28;
        const handleSize = 18;
        overlay.lockBtn.style.left = `${screenLeft + inset}px`;
        overlay.lockBtn.style.top = `${screenTop + inset}px`;
        overlay.deleteBtn.style.left = `${screenRight - inset - btnSize}px`;
        overlay.deleteBtn.style.top = `${screenTop + inset}px`;
        overlay.resizeHandle.style.left = `${screenRight - inset - handleSize}px`;
        overlay.resizeHandle.style.top = `${screenBottom - inset - handleSize}px`;
        overlay.sizeLabel.style.left = `${(screenLeft + screenRight) / 2}px`;
        overlay.sizeLabel.style.top = `${(screenTop + screenBottom) / 2}px`;
        if (overlay.bindBtn) {
            overlay.bindBtn.style.left = `${screenLeft + inset}px`;
            overlay.bindBtn.style.top = `${screenBottom - inset - btnSize}px`;
        }
    }

    function updateAllPlacedMapOverlays() {
        for (const mapId of placedMapOverlays.keys()) updatePlacedMapOverlay(mapId);
    }

    function setPlacedMapSelectionUI(mapId, selected) {
        const overlay = placedMapOverlays.get(mapId);
        if (!overlay) return;
        if (!selected) overlay.sizeLabel.style.display = 'none';
    }

    function selectPlacedMap(mapId) {
        if (!isDM) return;
        if (selectedPlacedMapId === mapId) return;
        if (selectedPlacedMapId) setPlacedMapSelectionUI(selectedPlacedMapId, false);
        selectedPlacedMapId = mapId;
        setPlacedMapSelectionUI(mapId, true);
        updatePlacedMapOverlay(mapId);
    }

    function deselectPlacedMap() {
        if (!selectedPlacedMapId) return;
        setPlacedMapSelectionUI(selectedPlacedMapId, false);
        selectedPlacedMapId = null;
    }

    function togglePlacedMapLock(mapId) {
        if (!isDM) return;
        const placed = placedMapsData.find(m => m.id === mapId);
        if (!placed) return;
        socket.emit('placedMap:setLock', { id: mapId, isLocked: !placed.isLocked });
    }

    function togglePlacedMapBound(mapId) {
        if (!isDM) return;
        const placed = placedMapsData.find(m => m.id === mapId);
        if (!placed) return;
        socket.emit('placedMap:setBound', { id: mapId, isBound: !placed.isBound });
    }

    // ===== 地图缩放（右下角手柄拖拽，保持宽高比，松手吸附到整数格宽） =====
    let resizeState = null;

    function startResize(ev, mapId) {
        if (!isDM) return;
        ev.preventDefault();
        ev.stopPropagation();
        const node = placedMapNodes.get(mapId);
        const placed = placedMapsData.find(m => m.id === mapId);
        if (!node || !placed || placed.isLocked) return;
        const wrappedObjs = placed.isBound ? getWrappedObjects(placed) : null;
        resizeState = {
            mapId,
            startPointerX: ev.clientX,
            startWidthWorld: node.width(),
            ratio: node.height() / node.width(),
            scale: konvaStage.scaleX(),
            origGridX: placed.gridX,
            origGridY: placed.gridY,
            isBound: !!placed.isBound,
            wrappedFog: getFogRectsWrappedByMap(placed).map(f => ({ id: f.id, origX: f.x, origY: f.y, origW: f.w, origH: f.h })),
            wrappedTokens:   wrappedObjs ? wrappedObjs.tokens.map(t => ({ color: t.color, origGX: t.gridX, origGY: t.gridY })) : [],
            wrappedNpcs:     wrappedObjs ? wrappedObjs.npcs.map(n => ({ id: n.id, origGX: n.gridX, origGY: n.gridY })) : [],
            wrappedDrawings: wrappedObjs ? wrappedObjs.freeDrawings.map(d => ({ id: d.id, origPoints: d.points.slice() })) : [],
            wrappedRects:    wrappedObjs ? wrappedObjs.rects.map(r => ({ id: r.id, origGX: r.gridX, origGY: r.gridY, origGW: r.gridW, origGH: r.gridH })) : [],
        };
        const overlay = placedMapOverlays.get(mapId);
        if (overlay) {
            overlay.sizeLabel.style.display = '';
            updateSizeLabel(mapId);
        }
        document.addEventListener('mousemove', onResizeMove);
        document.addEventListener('mouseup', onResizeEnd);
    }

    function onResizeMove(ev) {
        if (!resizeState) return;
        const node = placedMapNodes.get(resizeState.mapId);
        if (!node) return;
        const deltaWorldX = (ev.clientX - resizeState.startPointerX) / resizeState.scale;
        let newWidthWorld = resizeState.startWidthWorld + deltaWorldX;
        if (newWidthWorld < GRID_SIZE) newWidthWorld = GRID_SIZE; // 最小 1 格
        node.width(newWidthWorld);
        node.height(newWidthWorld * resizeState.ratio);
        updatePlacedMapOverlay(resizeState.mapId);
        updateSizeLabel(resizeState.mapId);
        const scaleFactor = newWidthWorld / resizeState.startWidthWorld;
        const mapX1 = resizeState.origGridX * GRID_SIZE;
        const mapY1 = resizeState.origGridY * GRID_SIZE;
        // 实时缩放被包裹的迷雾（DM 端视觉效果，不同步服务端）
        if (resizeState.wrappedFog && resizeState.wrappedFog.length > 0) {
            resizeState.wrappedFog.forEach(({ id: fid, origX, origY, origW, origH }) => {
                const fogNode = worldFogNodes.get(fid);
                if (fogNode) fogNode.setAttrs({
                    x: mapX1 + (origX - mapX1) * scaleFactor,
                    y: mapY1 + (origY - mapY1) * scaleFactor,
                    width: origW * scaleFactor,
                    height: origH * scaleFactor,
                });
            });
            if (fogLayer) fogLayer.batchDraw();
        }
        // 实时缩放 isBound 四类对象（仅视觉，dragend 时才落盘）
        if (resizeState.isBound) {
            resizeState.wrappedTokens.forEach(({ color, origGX, origGY }) => {
                const newGX = resizeState.origGridX + (origGX + 0.5 - resizeState.origGridX) * scaleFactor - 0.5;
                const newGY = resizeState.origGridY + (origGY + 0.5 - resizeState.origGridY) * scaleFactor - 0.5;
                const tNode = worldTokenNodes.get(color);
                if (tNode) tNode.position({ x: (newGX + 0.5) * GRID_SIZE, y: (newGY + 0.5) * GRID_SIZE });
            });
            resizeState.wrappedNpcs.forEach(({ id: nid, origGX, origGY }) => {
                const newGX = resizeState.origGridX + (origGX + 0.5 - resizeState.origGridX) * scaleFactor - 0.5;
                const newGY = resizeState.origGridY + (origGY + 0.5 - resizeState.origGridY) * scaleFactor - 0.5;
                const nNode = worldNpcNodes.get(nid);
                if (nNode) nNode.position({ x: (newGX + 0.5) * GRID_SIZE, y: (newGY + 0.5) * GRID_SIZE });
            });
            resizeState.wrappedRects.forEach(({ id: rid, origGX, origGY, origGW, origGH }) => {
                const rNode = worldRectNodes.get(rid);
                if (rNode) rNode.setAttrs({
                    x: (resizeState.origGridX + (origGX - resizeState.origGridX) * scaleFactor) * GRID_SIZE,
                    y: (resizeState.origGridY + (origGY - resizeState.origGridY) * scaleFactor) * GRID_SIZE,
                    width: origGW * scaleFactor * GRID_SIZE,
                    height: origGH * scaleFactor * GRID_SIZE,
                });
            });
            resizeState.wrappedDrawings.forEach(({ id: did, origPoints }) => {
                const dNode = worldDrawingNodes.get(did);
                if (dNode) dNode.points(origPoints.map((v, i) =>
                    i % 2 === 0 ? mapX1 + (v - mapX1) * scaleFactor : mapY1 + (v - mapY1) * scaleFactor
                ));
            });
            if (resizeState.wrappedTokens.length || resizeState.wrappedNpcs.length) dynamicLayer.batchDraw();
            if (resizeState.wrappedDrawings.length || resizeState.wrappedRects.length) drawingLayer.batchDraw();
        }
        konvaStage.batchDraw();
    }

    function onResizeEnd() {
        if (!resizeState) return;
        const node = placedMapNodes.get(resizeState.mapId);
        const placed = placedMapsData.find(m => m.id === resizeState.mapId);
        if (node && placed) {
            const gw = Math.max(1, Math.round(node.width() / GRID_SIZE));
            // 缩放前先算被包裹对象（placed.gridWidth 仍为旧值）
            const oldGw = placed.gridWidth;
            const scaleFactor = gw / oldGw;
            const mapX1 = placed.gridX * GRID_SIZE;
            const mapY1 = placed.gridY * GRID_SIZE;
            const scaledFogRects = getFogRectsWrappedByMap(placed).map(f => ({
                id: f.id,
                x: mapX1 + (f.x - mapX1) * scaleFactor,
                y: mapY1 + (f.y - mapY1) * scaleFactor,
                w: f.w * scaleFactor,
                h: f.h * scaleFactor,
            }));
            let scaledTokens = [], scaledNpcs = [], scaledFreeDrawings = [], scaledRects = [];
            if (placed.isBound) {
                const wrapped = getWrappedObjects(placed);
                scaledTokens = wrapped.tokens.map(t => ({
                    id: t.color,
                    gridX: placed.gridX + (t.gridX + 0.5 - placed.gridX) * scaleFactor - 0.5,
                    gridY: placed.gridY + (t.gridY + 0.5 - placed.gridY) * scaleFactor - 0.5,
                }));
                scaledNpcs = wrapped.npcs.map(n => ({
                    id: n.id,
                    gridX: placed.gridX + (n.gridX + 0.5 - placed.gridX) * scaleFactor - 0.5,
                    gridY: placed.gridY + (n.gridY + 0.5 - placed.gridY) * scaleFactor - 0.5,
                }));
                scaledFreeDrawings = wrapped.freeDrawings.map(d => ({
                    id: d.id,
                    points: d.points.map((v, i) =>
                        i % 2 === 0 ? mapX1 + (v - mapX1) * scaleFactor : mapY1 + (v - mapY1) * scaleFactor
                    ),
                }));
                scaledRects = wrapped.rects.map(r => ({
                    id: r.id,
                    gridX: placed.gridX + (r.gridX - placed.gridX) * scaleFactor,
                    gridY: placed.gridY + (r.gridY - placed.gridY) * scaleFactor,
                    gridW: r.gridW * scaleFactor,
                    gridH: r.gridH * scaleFactor,
                }));
            }
            placed.gridWidth = gw;
            node.width(gw * GRID_SIZE);
            node.height(gw * resizeState.ratio * GRID_SIZE);
            // 乐观应用迷雾缩放
            scaledFogRects.forEach(({ id: fid, x, y, w, h }) => {
                const fog = worldFogData.find(f => f.id === fid);
                if (fog) { fog.x = x; fog.y = y; fog.w = w; fog.h = h; }
                const fogNode = worldFogNodes.get(fid);
                if (fogNode) fogNode.setAttrs({ x, y, width: w, height: h });
            });
            if (scaledFogRects.length > 0 && fogLayer) fogLayer.batchDraw();
            // 乐观应用四类对象缩放
            if (placed.isBound) {
                scaledTokens.forEach(({ id: tid, gridX: gx, gridY: gy }) => {
                    const t = worldTokensData.find(t => t.color === tid);
                    if (t) { t.gridX = gx; t.gridY = gy; }
                    const tNode = worldTokenNodes.get(tid);
                    if (tNode) tNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                });
                scaledNpcs.forEach(({ id: nid, gridX: gx, gridY: gy }) => {
                    const n = worldNpcsData.find(n => n.id === nid);
                    if (n) { n.gridX = gx; n.gridY = gy; }
                    const nNode = worldNpcNodes.get(nid);
                    if (nNode) nNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
                });
                scaledFreeDrawings.forEach(({ id: did, points: newPts }) => {
                    const d = worldDrawingsData.find(d => d.id === did);
                    if (d) d.points = newPts;
                    const dNode = worldDrawingNodes.get(did);
                    if (dNode) dNode.points(newPts);
                });
                scaledRects.forEach(({ id: rid, gridX: gx, gridY: gy, gridW: gW, gridH: gH }) => {
                    const r = worldRectsData.find(r => r.id === rid);
                    if (r) { r.gridX = gx; r.gridY = gy; r.gridW = gW; r.gridH = gH; }
                    const rNode = worldRectNodes.get(rid);
                    if (rNode) rNode.setAttrs({ x: gx * GRID_SIZE, y: gy * GRID_SIZE, width: gW * GRID_SIZE, height: gH * GRID_SIZE });
                });
                if ((scaledTokens.length || scaledNpcs.length) && dynamicLayer) dynamicLayer.batchDraw();
                if ((scaledFreeDrawings.length || scaledRects.length) && drawingLayer) drawingLayer.batchDraw();
            }
            updatePlacedMapOverlay(resizeState.mapId);
            konvaStage.batchDraw();
            socket.emit('placedMap:resize', {
                id: resizeState.mapId, gridWidth: gw,
                scaledFogRects, scaledTokens, scaledNpcs, scaledFreeDrawings, scaledRects,
            });
        }
        const overlay = placedMapOverlays.get(resizeState.mapId);
        if (overlay) overlay.sizeLabel.style.display = 'none';
        resizeState = null;
        document.removeEventListener('mousemove', onResizeMove);
        document.removeEventListener('mouseup', onResizeEnd);
    }

    function updateSizeLabel(mapId) {
        const overlay = placedMapOverlays.get(mapId);
        const node = placedMapNodes.get(mapId);
        if (!overlay || !node) return;
        const gw = node.width() / GRID_SIZE;
        const gh = node.height() / GRID_SIZE;
        overlay.sizeLabel.textContent = `宽 ${gw.toFixed(1)} 格 × 高 ${gh.toFixed(1)} 格`;
    }

    function removePlacedMap(mapId) {
        if (!isDM) return;
        socket.emit('placedMap:remove', mapId);
    }

    // ===== Phase 3 Socket 事件监听：服务端世界状态同步 =====

    // 资产上传确认 → 刷新资产库 + 触发放置
    socket.on('mapAsset:uploaded', ({ assetId }) => {
        renderAssetLibrary();
        const cb = pendingAssetUpload.get(assetId);
        if (cb) { pendingAssetUpload.delete(assetId); cb(); }
    });

    // 资产按需拉取响应 → 缓存并渲染等待中的地图 + 刷新资产库
    socket.on('mapAsset:fetched', ({ assetId, base64, originalWidth, originalHeight }) => {
        mapAssetCache[assetId] = { base64, originalWidth, originalHeight };
        renderAssetLibrary();
        placedMapsData.forEach(placed => {
            if (placed.assetId === assetId && !placedMapNodes.has(placed.id) && staticLayer) {
                renderPlacedMap(placed);
            }
        });
    });

    // 服务端广播：地图被放置（DM 自己的操作也会收到）
    socket.on('placedMap:added', (placedData) => {
        placedMapsData.push(placedData);
        if (mapAssetCache[placedData.assetId] && staticLayer) {
            renderPlacedMap(placedData, true);
            if (isDM) selectPlacedMap(placedData.id);
        } else if (!mapAssetCache[placedData.assetId]) {
            socket.emit('mapAsset:fetch', placedData.assetId);
        }
        if (isDM) focusOnPlacedMap(placedData.assetId);
    });

    socket.on('placedMap:moved', ({ id, gridX, gridY, movedFogRects, movedTokens, movedNpcs, movedFreeDrawings, movedRects }) => {
        const placed = placedMapsData.find(m => m.id === id);
        if (placed) { placed.gridX = gridX; placed.gridY = gridY; }
        const node = placedMapNodes.get(id);
        if (node) {
            node.position({ x: gridX * GRID_SIZE, y: gridY * GRID_SIZE });
            updatePlacedMapOverlay(id);
            if (staticLayer) staticLayer.batchDraw();
        }
        if (Array.isArray(movedFogRects) && movedFogRects.length > 0) {
            movedFogRects.forEach(({ id: fid, x, y }) => {
                const fog = worldFogData.find(f => f.id === fid);
                if (fog) { fog.x = x; fog.y = y; }
                const fogNode = worldFogNodes.get(fid);
                if (fogNode) fogNode.position({ x, y });
            });
            if (fogLayer) fogLayer.batchDraw();
        }
        if (Array.isArray(movedTokens) && movedTokens.length > 0) {
            movedTokens.forEach(({ id: tid, gridX: gx, gridY: gy }) => {
                const t = worldTokensData.find(t => t.color === tid);
                if (t) { t.gridX = gx; t.gridY = gy; }
                const tNode = worldTokenNodes.get(tid);
                if (tNode) tNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
            });
            if (dynamicLayer) dynamicLayer.batchDraw();
        }
        if (Array.isArray(movedNpcs) && movedNpcs.length > 0) {
            movedNpcs.forEach(({ id: nid, gridX: gx, gridY: gy }) => {
                const n = worldNpcsData.find(n => n.id === nid);
                if (n) { n.gridX = gx; n.gridY = gy; }
                const nNode = worldNpcNodes.get(nid);
                if (nNode) nNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
            });
            if (dynamicLayer) dynamicLayer.batchDraw();
        }
        if (Array.isArray(movedFreeDrawings) && movedFreeDrawings.length > 0) {
            movedFreeDrawings.forEach(({ id: did, points: newPts }) => {
                const d = worldDrawingsData.find(d => d.id === did);
                if (d) d.points = newPts;
                const dNode = worldDrawingNodes.get(did);
                if (dNode) dNode.points(newPts);
            });
            if (drawingLayer) drawingLayer.batchDraw();
        }
        if (Array.isArray(movedRects) && movedRects.length > 0) {
            movedRects.forEach(({ id: rid, gridX: gx, gridY: gy }) => {
                const r = worldRectsData.find(r => r.id === rid);
                if (r) { r.gridX = gx; r.gridY = gy; }
                const rNode = worldRectNodes.get(rid);
                if (rNode) rNode.position({ x: gx * GRID_SIZE, y: gy * GRID_SIZE });
            });
            if (drawingLayer) drawingLayer.batchDraw();
        }
    });

    socket.on('placedMap:resized', ({ id, gridWidth, scaledFogRects, scaledTokens, scaledNpcs, scaledFreeDrawings, scaledRects }) => {
        const placed = placedMapsData.find(m => m.id === id);
        if (!placed) return;
        placed.gridWidth = gridWidth;
        const node = placedMapNodes.get(id);
        if (!node) return;
        const asset = mapAssetCache[placed.assetId];
        if (!asset) return;
        const ratio = asset.originalHeight / asset.originalWidth;
        node.width(gridWidth * GRID_SIZE);
        node.height(gridWidth * ratio * GRID_SIZE);
        updatePlacedMapOverlay(id);
        if (staticLayer) staticLayer.batchDraw();
        if (Array.isArray(scaledFogRects) && scaledFogRects.length > 0) {
            scaledFogRects.forEach(({ id: fid, x, y, w, h }) => {
                const fog = worldFogData.find(f => f.id === fid);
                if (fog) { fog.x = x; fog.y = y; fog.w = w; fog.h = h; }
                const fogNode = worldFogNodes.get(fid);
                if (fogNode) fogNode.setAttrs({ x, y, width: w, height: h });
            });
            if (fogLayer) fogLayer.batchDraw();
        }
        if (Array.isArray(scaledTokens) && scaledTokens.length > 0) {
            scaledTokens.forEach(({ id: tid, gridX: gx, gridY: gy }) => {
                const t = worldTokensData.find(t => t.color === tid);
                if (t) { t.gridX = gx; t.gridY = gy; }
                const tNode = worldTokenNodes.get(tid);
                if (tNode) tNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
            });
            if (dynamicLayer) dynamicLayer.batchDraw();
        }
        if (Array.isArray(scaledNpcs) && scaledNpcs.length > 0) {
            scaledNpcs.forEach(({ id: nid, gridX: gx, gridY: gy }) => {
                const n = worldNpcsData.find(n => n.id === nid);
                if (n) { n.gridX = gx; n.gridY = gy; }
                const nNode = worldNpcNodes.get(nid);
                if (nNode) nNode.position({ x: (gx + 0.5) * GRID_SIZE, y: (gy + 0.5) * GRID_SIZE });
            });
            if (dynamicLayer) dynamicLayer.batchDraw();
        }
        if (Array.isArray(scaledFreeDrawings) && scaledFreeDrawings.length > 0) {
            scaledFreeDrawings.forEach(({ id: did, points: newPts }) => {
                const d = worldDrawingsData.find(d => d.id === did);
                if (d) d.points = newPts;
                const dNode = worldDrawingNodes.get(did);
                if (dNode) dNode.points(newPts);
            });
            if (drawingLayer) drawingLayer.batchDraw();
        }
        if (Array.isArray(scaledRects) && scaledRects.length > 0) {
            scaledRects.forEach(({ id: rid, gridX: gx, gridY: gy, gridW: gW, gridH: gH }) => {
                const r = worldRectsData.find(r => r.id === rid);
                if (r) { r.gridX = gx; r.gridY = gy; r.gridW = gW; r.gridH = gH; }
                const rNode = worldRectNodes.get(rid);
                if (rNode) rNode.setAttrs({ x: gx * GRID_SIZE, y: gy * GRID_SIZE, width: gW * GRID_SIZE, height: gH * GRID_SIZE });
            });
            if (drawingLayer) drawingLayer.batchDraw();
        }
    });

    socket.on('placedMap:lockSet', ({ id, isLocked }) => {
        const placed = placedMapsData.find(m => m.id === id);
        if (placed) placed.isLocked = isLocked;
        const node = placedMapNodes.get(id);
        if (node && isDM) node.draggable(!isLocked);
        const overlay = placedMapOverlays.get(id);
        if (overlay) {
            overlay.lockBtn.textContent = isLocked ? '🔒' : '🔓';
            overlay.lockBtn.title = isLocked ? '点击解锁' : '点击锁定';
            overlay.lockBtn.classList.toggle('locked', isLocked);
            // 若当前正在 hover，刷新 delete/resize 可见性（锁定后隐藏，解锁后显示）
            if (overlay.isHovered) overlay.showBtns();
        }
    });

    socket.on('placedMap:boundSet', ({ id, isBound }) => {
        const placed = placedMapsData.find(m => m.id === id);
        if (placed) placed.isBound = isBound;
        const overlay = placedMapOverlays.get(id);
        if (overlay && overlay.bindBtn) {
            overlay.bindBtn.textContent = isBound ? '📌' : '📍';
            overlay.bindBtn.title = isBound ? '对象已绑定（点击解绑）' : '对象未绑定（点击绑定）';
            overlay.bindBtn.classList.toggle('unbound', !isBound);
        }
    });

    // 自定义 NPC 颜色输入（change 而非 input，避免每次滑动都生成）
    document.getElementById('npc-custom-color-input').addEventListener('change', (e) => {
        if (!isDM) return;
        spawnNPCWithColor(e.target.value);
    });


    socket.on('placedMap:removed', (id) => {
        const idx = placedMapsData.findIndex(m => m.id === id);
        if (idx !== -1) placedMapsData.splice(idx, 1);
        const node = placedMapNodes.get(id);
        if (node) { node.destroy(); placedMapNodes.delete(id); if (staticLayer) staticLayer.batchDraw(); }
        const overlay = placedMapOverlays.get(id);
        if (overlay) { overlay.wrap.remove(); placedMapOverlays.delete(id); }
        if (selectedPlacedMapId === id) selectedPlacedMapId = null;
    });

    // 资产库删除广播：清除缓存 + 销毁所有对应地图实例节点
    socket.on('mapAsset:removed', ({ assetId }) => {
        delete mapAssetCache[assetId];
        const removedIds = placedMapsData.filter(m => m.assetId === assetId).map(m => m.id);
        removedIds.forEach(id => {
            const idx = placedMapsData.findIndex(m => m.id === id);
            if (idx !== -1) placedMapsData.splice(idx, 1);
            const node = placedMapNodes.get(id);
            if (node) { node.destroy(); placedMapNodes.delete(id); }
            const overlay = placedMapOverlays.get(id);
            if (overlay) { overlay.wrap.remove(); placedMapOverlays.delete(id); }
            if (selectedPlacedMapId === id) selectedPlacedMapId = null;
        });
        if (staticLayer && removedIds.length > 0) staticLayer.batchDraw();
        renderAssetLibrary();
    });

    // 撤销/重做后服务端广播完整世界快照，全员重渲
    socket.on('world:sync', (world) => {
        // 更新本地数据数组
        placedMapsData.length = 0;
        worldTokensData.length = 0;
        worldNpcsData.length = 0;
        worldDrawingsData.length = 0;
        worldRectsData.length = 0;
        worldFogData.length = 0;
        (world.placedMaps || []).forEach(m => placedMapsData.push(m));
        (world.tokens || []).forEach(t => worldTokensData.push(t));
        (world.npcs || []).forEach(n => worldNpcsData.push(n));
        (world.freeDrawings || []).forEach(d => worldDrawingsData.push(d));
        (world.rects || []).forEach(r => worldRectsData.push(r));
        (world.fogRects || []).forEach(f => worldFogData.push(f));

        if (konvaStage) {
            // 销毁所有 Konva 节点
            placedMapNodes.forEach(node => node.destroy());
            placedMapNodes.clear();
            placedMapOverlays.forEach(ov => ov.wrap.remove());
            placedMapOverlays.clear();
            selectedPlacedMapId = null;
            worldTokenNodes.forEach(node => node.destroy());
            worldTokenNodes.clear();
            worldNpcNodes.forEach(node => node.destroy());
            worldNpcNodes.clear();
            worldDrawingNodes.forEach(node => node.destroy());
            worldDrawingNodes.clear();
            worldRectNodes.forEach(node => node.destroy());
            worldRectNodes.clear();
            liveStrokeNodes.forEach(node => node.destroy());
            liveStrokeNodes.clear();
            worldFogNodes.forEach(node => node.destroy());
            worldFogNodes.clear();
            renderPendingWorldObjects();
        }
        // 按需拉取缺失的地图资产（undo 后可能出现之前未缓存的资产）
        (world.placedMaps || []).forEach(pm => {
            if (!mapAssetCache[pm.assetId]) socket.emit('mapAsset:fetch', pm.assetId);
        });
    });

    // 所有变量和监听器就绪后启动应用
    startApp();

</script>
</body>
</html>
